[package]
name = "disk-clean"
version = "0.1.0"
edition = "2021"
description = "Find and clean up Rust project target directories to reclaim disk space"
license = "MIT"
repository = "https://github.com/xudong963/disk-clean"
keywords = ["rust", "clean", "disk", "target", "cargo"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
